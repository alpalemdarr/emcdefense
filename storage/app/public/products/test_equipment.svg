<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgTest" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c22"/>
      <stop offset="100%" stop-color="#111c47"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#bgTest)"/>

  <!-- Toroidal Current Injection Probe / Clamp -->
  <circle cx="250" cy="175" r="95" fill="none" stroke="#334155" stroke-width="36"/>
  <circle cx="250" cy="175" r="95" fill="none" stroke="#1e293b" stroke-width="26"/>
  <circle cx="250" cy="175" r="50" fill="#070c22" stroke="#475569" stroke-width="2"/>

  <!-- Cable passing through center aperture -->
  <line x1="80" y1="175" x2="420" y2="175" stroke="#f59e0b" stroke-width="14" stroke-linecap="round"/>
  <line x1="80" y1="175" x2="420" y2="175" stroke="#fbbf24" stroke-width="4" stroke-dasharray="8 6" stroke-linecap="round"/>

  <!-- Probe Latch & Hinge -->
  <rect x="238" y="55" width="24" height="25" rx="3" fill="#64748b" stroke="#334155"/>
  <rect x="238" y="270" width="24" height="25" rx="3" fill="#64748b" stroke="#334155"/>

  <!-- N-Connector Terminal on top -->
  <rect x="330" y="100" width="30" height="20" rx="3" fill="#cbd5e1" stroke="#475569" transform="rotate(35 330 100)"/>

  <!-- Label Badge -->
  <rect x="15" y="15" width="140" height="26" rx="6" fill="rgba(30,45,125,0.8)" stroke="#3d52c4"/>
  <text x="85" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#93c5fd" letter-spacing="1">CURRENT PROBE</text>

  <text x="250" y="325" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#94a3b8" font-weight="600">BCI Injection Clamp · MIL-STD-461 CS114</text>
</svg>
