<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgFilt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c22"/>
      <stop offset="100%" stop-color="#0f224a"/>
    </linearGradient>
    <linearGradient id="filterBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#bgFilt)"/>
  
  <!-- Filter Chassis -->
  <rect x="100" y="80" width="300" height="180" rx="8" fill="url(#filterBody)" stroke="#475569" stroke-width="3"/>
  <rect x="80" y="70" width="20" height="200" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="400" y="70" width="20" height="200" rx="4" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  
  <!-- Screws on flanges -->
  <circle cx="90" cy="85" r="4" fill="#94a3b8"/>
  <circle cx="90" cy="170" r="4" fill="#94a3b8"/>
  <circle cx="90" cy="255" r="4" fill="#94a3b8"/>
  <circle cx="410" cy="85" r="4" fill="#94a3b8"/>
  <circle cx="410" cy="170" r="4" fill="#94a3b8"/>
  <circle cx="410" cy="255" r="4" fill="#94a3b8"/>
  
  <!-- High Current Terminals (Brass Studs) -->
  <rect x="60" y="110" width="20" height="14" rx="2" fill="url(#brass)"/>
  <circle cx="55" cy="117" r="6" fill="url(#brass)"/>
  <rect x="60" y="160" width="20" height="14" rx="2" fill="url(#brass)"/>
  <circle cx="55" cy="167" r="6" fill="url(#brass)"/>
  <rect x="60" y="210" width="20" height="14" rx="2" fill="url(#brass)"/>
  <circle cx="55" cy="217" r="6" fill="url(#brass)"/>

  <rect x="420" y="110" width="20" height="14" rx="2" fill="url(#brass)"/>
  <circle cx="445" cy="117" r="6" fill="url(#brass)"/>
  <rect x="420" y="160" width="20" height="14" rx="2" fill="url(#brass)"/>
  <circle cx="445" cy="167" r="6" fill="url(#brass)"/>
  <rect x="420" y="210" width="20" height="14" rx="2" fill="url(#brass)"/>
  <circle cx="445" cy="217" r="6" fill="url(#brass)"/>

  <!-- Metal Specification Plate -->
  <rect x="150" y="110" width="200" height="120" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="250" y="135" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="13" fill="#60a5fa" letter-spacing="1">TEMPEST EMI FILTER</text>
  <text x="250" y="160" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="11" fill="#f8fafc">100 dB @ 10 kHz - 10 GHz</text>
  <text x="250" y="185" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8">250 VAC / 50 Hz / 16A</text>
  <text x="250" y="210" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#e2e8f0" font-weight="600">MIL-STD-220C / SDIP-27</text>

  <rect x="15" y="15" width="130" height="26" rx="6" fill="rgba(30,45,125,0.8)" stroke="#3d52c4"/>
  <text x="80" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#93c5fd" letter-spacing="1">POWER FILTER</text>
</svg>
