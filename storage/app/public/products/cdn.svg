<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCdn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c22"/>
      <stop offset="100%" stop-color="#141c42"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#bgCdn)"/>

  <!-- CDN Aluminum Case -->
  <rect x="110" y="90" width="280" height="170" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <rect x="125" y="105" width="250" height="140" rx="4" fill="#0f172a" stroke="#334155"/>

  <!-- Left: AE Port -->
  <rect x="85" y="145" width="25" height="40" rx="3" fill="#475569"/>
  <circle cx="95" cy="155" r="4" fill="#38bdf8"/>
  <circle cx="95" cy="175" r="4" fill="#38bdf8"/>
  <text x="145" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8" font-weight="700">AE PORT</text>

  <!-- Right: EUT Port -->
  <rect x="390" y="145" width="25" height="40" rx="3" fill="#475569"/>
  <circle cx="405" cy="155" r="4" fill="#ef4444"/>
  <circle cx="405" cy="175" r="4" fill="#ef4444"/>
  <text x="315" y="170" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#94a3b8" font-weight="700">EUT PORT</text>

  <!-- Center RF Coupling Port (BNC) -->
  <circle cx="250" cy="165" r="18" fill="#cbd5e1" stroke="#64748b" stroke-width="2"/>
  <circle cx="250" cy="165" r="8" fill="#1e293b"/>
  <circle cx="250" cy="165" r="3" fill="#f8fafc"/>
  <text x="250" y="200" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" fill="#94a3b8" font-weight="600">RF IN 50Ω</text>

  <!-- Standard text -->
  <text x="250" y="130" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#60a5fa" font-weight="700">CDN M2/M3 · IEC 61000-4-6</text>

  <rect x="15" y="15" width="130" height="26" rx="6" fill="rgba(30,45,125,0.8)" stroke="#3d52c4"/>
  <text x="80" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#93c5fd" letter-spacing="1">COUPLING CDN</text>
</svg>
