<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgCham" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#0e1738"/>
    </linearGradient>
  </defs>
  <rect width="500" height="350" fill="url(#bgCham)"/>
  
  <!-- Anechoic Chamber Perspective Outline -->
  <polygon points="40,20 460,20 380,80 120,80" fill="#0f172a" stroke="#1e293b"/>
  <polygon points="40,330 460,330 380,270 120,270" fill="#1e293b" stroke="#334155"/>
  <polygon points="40,20 120,80 120,270 40,330" fill="#0f172a" stroke="#1e293b"/>
  <polygon points="460,20 380,80 380,270 460,330" fill="#0f172a" stroke="#1e293b"/>
  <rect x="120" y="80" width="260" height="190" fill="#0a0f24" stroke="#1e2d7d" stroke-width="2"/>

  <!-- Pyramidal Absorbers on Wall -->
  <g fill="#1e2d7d" stroke="#3d52c4" stroke-width="0.5">
    <!-- Ceiling Pyramids -->
    <polygon points="130,80 140,105 150,80"/>
    <polygon points="150,80 160,105 170,80"/>
    <polygon points="170,80 180,105 190,80"/>
    <polygon points="190,80 200,105 210,80"/>
    <polygon points="210,80 220,105 230,80"/>
    <polygon points="230,80 240,105 250,80"/>
    <polygon points="250,80 260,105 270,80"/>
    <polygon points="270,80 280,105 290,80"/>
    <polygon points="290,80 300,105 310,80"/>
    <polygon points="310,80 320,105 330,80"/>
    <polygon points="330,80 340,105 350,80"/>
    <polygon points="350,80 360,105 370,80"/>
  </g>

  <!-- Turntable in Chamber -->
  <ellipse cx="250" cy="245" rx="55" ry="14" fill="#334155" stroke="#64748b" stroke-width="2"/>
  
  <!-- Device Under Test (DUT) -->
  <rect x="235" y="215" width="30" height="24" rx="3" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="250" cy="225" r="3" fill="#38bdf8"/>

  <!-- Antenna Mast with Horn Antenna -->
  <line x1="330" y1="250" x2="330" y2="150" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="325,170 300,160 300,180" fill="#3b82f6" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- RF Waves between antenna & DUT -->
  <path d="M 290,165 A 15 15 0 0 0 290,175" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
  <path d="M 280,160 A 25 25 0 0 0 280,180" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <path d="M 270,155 A 35 35 0 0 0 270,185" fill="none" stroke="#818cf8" stroke-width="1.5"/>

  <rect x="15" y="15" width="130" height="26" rx="6" fill="rgba(30,45,125,0.8)" stroke="#3d52c4"/>
  <text x="80" y="32" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="11" fill="#93c5fd" letter-spacing="1">CHAMBER</text>
</svg>
